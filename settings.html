  <div class="container mt-3">
    <h1 class="mb-3">Input Settings</h1>
    <p class="text-muted">Tambahkan atau hapus pilihan yang dipakai pada form input (Block, Product, Lantai, Code).</p>

    <div class="row gy-3">
      <div class="col-12 col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Blocks</h5>
            <div id="blocksList" class="mb-2"></div>
            <div class="input-group">
              <input id="blocksInput" class="form-control" placeholder="Tambah block (contoh: AA09)">
              <button id="blocksAdd" class="btn btn-primary">Add</button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Products</h5>
            <div id="productsList" class="mb-2"></div>
            <div class="input-group">
              <input id="productsInput" class="form-control" placeholder="Tambah product (contoh: Pouch)">
              <button id="productsAdd" class="btn btn-primary">Add</button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Lantai</h5>
            <div id="levelsList" class="mb-2"></div>
            <div class="input-group">
              <input id="levelsInput" class="form-control" placeholder="Tambah lantai (contoh: L6)">
              <button id="levelsAdd" class="btn btn-primary">Add</button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Codes</h5>
            <div id="codesList" class="mb-2"></div>
            <div class="input-group">
              <input id="codesInput" class="form-control" placeholder="Tambah code (contoh: ZZZ)">
              <button id="codesAdd" class="btn btn-primary">Add</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
